{% extends "base.html" %}

{% block fonts %}
{% endblock %}

{% block libs %}
{% endblock %}

{% block extrahead %}
<script src="{{ 'assets/javascripts/modernizr.86422ebf.js' | url }}"></script>
{% endblock %}
{% block scripts %}
{{ super() }}
<script>
  // The search index splits words on dashes, but the theme only splits queries
  // on spaces, so annotations like "@psalm-taint-specialize" never matched.
  // Also index dashed words whole, along with every run of two or more of
  // their parts (so "taint-specialize" matches too), and trim queries the way
  // indexed words are.
  (function (lunr) {
    if (!lunr)
      return
    var tokenize = lunr.tokenizer
    lunr.tokenizer = function (obj, metadata) {
      var tokens = tokenize(obj, metadata)
      if (obj == null || Array.isArray(obj))
        return tokens
      var words = obj.toString().toLowerCase().match(/\w+(?:-\w+)+/g) || []
      words.forEach(function (word) {
        var parts = word.split("-")
        for (var start = 0; start < parts.length - 1; start++) {
          for (var end = start + 2; end <= parts.length; end++) {
            var tokenMetadata = lunr.utils.clone(metadata) || {}
            tokenMetadata.index = tokens.length
            tokens.push(new lunr.Token(parts.slice(start, end).join("-"), tokenMetadata))
          }
        }
      })
      return tokens
    }
    // lunr and the theme both read and write lunr.tokenizer.separator
    Object.defineProperty(lunr.tokenizer, "separator", {
      get: function () { return tokenize.separator },
      set: function (separator) { tokenize.separator = separator }
    })
    var term = lunr.Query.prototype.term
    lunr.Query.prototype.term = function (value, options) {
      if (typeof value === "string")
        value = value.replace(/^\W+/, "").replace(/\W+$/, "") || value
      return term.call(this, value, options)
    }
  })(window.lunr)

  // Search result titles have the same doubly escaped code spans as the
  // sidebars (see partials/toc-title.html). The theme fetches the index the
  // first time search is used, so fix the titles as it loads.
  if (window.fetch)
    window.fetch = (function (fetch) {
      return function (url) {
        var response = fetch.apply(this, arguments)
        if (typeof url !== "string" || !/\/search\/search_index\.json$/.test(url))
          return response
        return response.then(function (res) {
          var json = res.json.bind(res)
          res.json = function () {
            return json().then(function (index) {
              index.docs.forEach(function (doc) {
                doc.title = doc.title.replace(/&amp;(lt|gt|quot|amp);/g, "&$1;")
              })
              return index
            })
          }
          return res
        })
      }
    })(window.fetch)

  // Keep the current page visible when it sits far down the sidebar
  window.addEventListener("load", function () {
    var link = document.querySelector(".psalm-nav .psalm-nav__link--active")
    if (!link)
      return
    var boxes = [link.closest(".psalm-nav__list--root"), link.closest(".md-sidebar__scrollwrap")]
    boxes.forEach(function (box) {
      if (!box || box.scrollHeight <= box.clientHeight)
        return
      var offset = link.getBoundingClientRect().top - box.getBoundingClientRect().top
      if (offset > box.clientHeight - 80)
        box.scrollTop += offset - box.clientHeight / 3
    })
  })
</script>
{% endblock %}
