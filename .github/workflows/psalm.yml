name: Psalm

on:
  push:
    branches: [master]
  pull_request:

jobs:
  psalm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      # Official Psalm 7 image. It runs `composer install --no-scripts` itself (so the
      # post-install phinx migrate, which needs a database, does not run), discovers
      # psalm.xml, and honours its errorBaseline. Taint analysis produces the SARIF report.
      - name: Psalm
        uses: docker://ghcr.io/psalm/psalm-github-actions:7.0.4
        with:
          security_analysis: true
          report_file: results.sarif

      - name: Upload results to the Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
